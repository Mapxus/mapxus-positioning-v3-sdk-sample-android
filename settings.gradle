pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven {
            name 'release'
            url("https://nexus3.mapxus.com/repository/mapxus-ps-sdk-v3-android")
            allowInsecureProtocol = true
        }
    }
}

rootProject.name = "mapxus-positioning-sdk-sample-android"
include ':app'
